<!DOCTYPE html>
<html>
<head>
    <title>Article with Lazy Images</title>
</head>
<body>
    <article>
        <p>Content with lazy images.</p>
        <img data-src="https://example.com/lazy1.jpg" alt="Lazy image 1" class="lazy-image">
        <img data-lazy-src="https://example.com/lazy2.jpg" alt="Lazy image 2" loading="lazy">
        <img src="https://example.com/normal.jpg" alt="Normal image">
    </article>
</body>
</html>
