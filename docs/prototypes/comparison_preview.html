<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parser Comparison Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1em;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            border: none;
            background: white;
            border: 2px solid #ddd;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid #f0f0f0;
        }

        .stat {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .content {
            line-height: 1.6;
            font-size: 1em;
        }

        .content p {
            margin-bottom: 15px;
        }

        .content img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .image-item {
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
        }

        .no-content {
            color: #999;
            font-style: italic;
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .tabs {
                flex-direction: column;
            }

            .tab-button {
                width: 100%;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

            readabilityImages: [],

        function calculateStats(text, images) {
            return {
                chars: text.length,
                words: text.trim().split(/\s+/).filter(w => w.length > 0).length,
                paras: text.trim().split(/\n\n+/).filter(p => p.trim().length > 0).length,
                images: images.length
            };
        }

        function renderContent(text, images) {
            let html = '';

            if (text) {
                const paragraphs = text.split(/\n\n+/).filter(p => p.trim());
                paragraphs.forEach(para => {
                    if (para.trim()) {
                        html += `<p>${escapeHtml(para.trim())}</p>`;
                    }
                });
            }

            if (images && images.length > 0) {
                html += '<div class="image-gallery">';
                images.forEach(imgUrl => {
                    html += `<div class="image-item"><img src="${escapeHtml(imgUrl)}" alt="Content image" loading="lazy"></div>`;
                });
                html += '</div>';
            }

            return html || '<div class="no-content">No content available</div>';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function updateTabs() {
            // Readability Only
            const readabilityStats = calculateStats(parserData.readabilityText, []);
            document.getElementById('stat-readability-chars').textContent = readabilityStats.chars.toLocaleString();
            document.getElementById('stat-readability-words').textContent = readabilityStats.words.toLocaleString();
            document.getElementById('stat-readability-paras').textContent = readabilityStats.paras.toLocaleString();
            document.getElementById('stat-readability-images').textContent = '0';
            document.getElementById('readability-content').innerHTML = renderContent(parserData.readabilityText, []);

            // Readability + Images
            const readabilityImagesStats = calculateStats(parserData.readabilityText, parserData.readabilityImages);
            document.getElementById('stat-readability-images-chars').textContent = readabilityImagesStats.chars.toLocaleString();
            document.getElementById('stat-readability-images-words').textContent = readabilityImagesStats.words.toLocaleString();
            document.getElementById('stat-readability-images-paras').textContent = readabilityImagesStats.paras.toLocaleString();
            document.getElementById('stat-readability-images-count').textContent = readabilityImagesStats.images.toLocaleString();
            document.getElementById('readability-images-content').innerHTML = renderContent(parserData.readabilityText, parserData.readabilityImages);

            // Node-unfluff
            const unfluffStats = calculateStats(parserData.nodeUnfluffText, parserData.nodeUnfluffImages);
            document.getElementById('stat-unfluff-chars').textContent = unfluffStats.chars.toLocaleString();
            document.getElementById('stat-unfluff-words').textContent = unfluffStats.words.toLocaleString();
            document.getElementById('stat-unfluff-paras').textContent = unfluffStats.paras.toLocaleString();
            document.getElementById('stat-unfluff-images').textContent = unfluffStats.images.toLocaleString();
            document.getElementById('node-unfluff-content').innerHTML = renderContent(parserData.nodeUnfluffText, parserData.nodeUnfluffImages);
        }

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.dataset.tab;

                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                button.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', updateTabs);
